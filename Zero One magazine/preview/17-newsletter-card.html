<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.card{background:var(--cream); border:1px solid var(--sand); padding:24px; display:flex; align-items:center; gap:20px; max-width:640px}
.illus{flex:0 0 96px; height:96px; color:var(--terracotta)}
.copy h3{font-family:Georgia,serif; font-size:26px; font-weight:400; margin:0 0 6px; font-style:italic}
.copy p{font-size:14px; color:var(--ink-2); margin:0 0 14px; line-height:1.55; font-family:Georgia,serif}
.form{display:flex; gap:10px;}
.form input{flex:1; background:transparent; border:none; border-bottom:1px solid var(--clay); padding:8px 2px; font-family:Georgia,serif; font-size:15px; color:var(--ink); outline:none}
.form button{font-family:Georgia,serif; font-style:italic; font-size:14px; background:var(--terracotta); color:var(--cream); border:none; padding:10px 22px; border-radius:999px; cursor:pointer}
</style></head>
<body>
<div class="card">
  <div class="illus"><object data="../assets/ornaments/letter.svg" type="image/svg+xml" style="pointer-events:none;width:96px;height:96px"></object></div>
  <div class="copy" style="flex:1">
    <h3>A letter, once a month.</h3>
    <p>No roundups. Just one story — usually a woman I can't stop thinking about.</p>
    <form class="form" onsubmit="return false">
      <input placeholder="your email"/>
      <button type="submit">Join</button>
    </form>
  </div>
</div>
</body></html>
