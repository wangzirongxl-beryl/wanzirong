<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px}
.card{background:var(--cream); border:1px solid var(--sand); border-radius:4px; padding:20px; max-width:380px; position:relative; transition:border-color var(--dur-base) var(--ease-out)}
.card:hover{border-color:var(--clay)}
.card .arrow{position:absolute;top:14px;right:16px;opacity:0;transition:opacity var(--dur-base);font-family:Georgia,serif;font-style:italic;color:var(--terracotta);font-size:18px;}
.card:hover .arrow{opacity:1}
.meta-line{display:flex;gap:10px;font-family:Georgia,serif;font-style:italic;font-size:12px;color:var(--clay); text-transform:uppercase; letter-spacing:0.18em; margin-bottom:10px}
.dot-sep{opacity:0.5}
.card h3{font-family:Georgia,serif; font-size:24px; line-height:1.2; font-weight:400; font-style:italic; color:var(--ink); margin:0 0 8px}
.card p{font-size:14px; color:var(--ink-2); line-height:1.6; margin:0; font-family:Georgia,serif}
</style></head>
<body>
<div class="card">
  <span class="arrow">→</span>
  <div class="meta-line"><span>Profile</span><span class="dot-sep">·</span><span>Mar 12</span><span class="dot-sep">·</span><span>7 min</span></div>
  <h3>A morning with Liu Yuling</h3>
  <p>She answers the door barefoot. It is nine a.m. on a Tuesday in late March, and she has already written for three hours.</p>
</div>
</body></html>
