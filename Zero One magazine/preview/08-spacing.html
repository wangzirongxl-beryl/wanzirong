<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.scale{display:flex;align-items:flex-end;gap:6px}
.b{background:var(--rose-taupe-3, #E3D6CB);border:1px solid var(--sand);display:flex;align-items:flex-end;justify-content:center;font-family:ui-monospace,monospace;font-size:10px;color:var(--ink-2);padding:3px 0}
</style></head>
<body>
<div class="eyebrow" style="margin-bottom:10px">Spacing scale · 8px baseline</div>
<div class="scale">

  <div class="b" style="width:18px;height:8px">8</div>
  <div class="b" style="width:22px;height:12px">12</div>
  <div class="b" style="width:26px;height:16px">16</div>
  <div class="b" style="width:34px;height:24px">24</div>
  <div class="b" style="width:42px;height:32px">32</div>
  <div class="b" style="width:56px;height:48px">48</div>
  <div class="b" style="width:72px;height:64px">64</div>
  <div class="b" style="width:100px;height:80px">96</div>
  <div class="b" style="width:128px;height:96px">128</div>
</div>
<div class="meta" style="margin-top:10px; font-size:12px">Tokens: <code>--space-1</code>…<code>--space-10</code>. Article gutter: <code>--space-6</code>.</div>
</body></html>
