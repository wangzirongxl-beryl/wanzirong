<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.row{display:flex; gap:18px; align-items:center; flex-wrap:wrap; color:var(--terracotta)}
.orn{width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:inherit}
.lbl{font-family:Georgia,serif; font-style:italic; font-size:11px; color:var(--ink-2); text-align:center; margin-top:4px}
.chip{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<div class="eyebrow" style="margin-bottom:12px">Ornaments · hand-drawn signs</div>
<div class="row">
  <div class="chip"><div class="orn"><object data="../assets/ornaments/leaf.svg" type="image/svg+xml" style="pointer-events:none;width:40px;height:40px"></object></div><span class="lbl">leaf</span></div>
  <div class="chip"><div class="orn"><object data="../assets/ornaments/sun.svg" type="image/svg+xml" style="pointer-events:none;width:40px;height:40px"></object></div><span class="lbl">sun</span></div>
  <div class="chip"><div class="orn" style="width:70px"><object data="../assets/ornaments/asterism.svg" type="image/svg+xml" style="pointer-events:none;width:70px;height:28px"></object></div><span class="lbl">asterism</span></div>
  <div class="chip"><div class="orn" style="width:80px"><object data="../assets/ornaments/wave.svg" type="image/svg+xml" style="pointer-events:none;width:80px;height:28px"></object></div><span class="lbl">wave</span></div>
  <div class="chip"><div class="orn"><object data="../assets/ornaments/letter.svg" type="image/svg+xml" style="pointer-events:none;width:40px;height:40px"></object></div><span class="lbl">letter</span></div>
</div>
</body></html>
