<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px 20px; background:var(--paper); background-image:url('../assets/textures/paper-grain.png')}
.header{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--sand); padding-bottom:14px}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand .mark{font-family:Georgia,serif; font-size:26px; font-style:italic; font-weight:400; color:var(--ink); letter-spacing:-0.01em}
.brand .sub{font-family:Georgia,serif; font-style:italic; font-size:13px; color:var(--clay); letter-spacing:0.22em; text-transform:uppercase}
.nav{display:flex; gap:32px; font-family:Georgia,serif; font-size:13px; font-style:italic; letter-spacing:0.16em; text-transform:uppercase}
.nav a{color:var(--ink); background-image:none;}
.nav a.active{color:var(--terracotta)}
.nav a.active::after{content:''; display:block; border-bottom:1px solid var(--terracotta); margin-top:3px}
</style></head>
<body>
<div class="header">
  <div class="brand"><span class="mark">Zero One</span><span class="sub">Magazine</span></div>
  <nav class="nav">
    <a class="active" href="#">Profiles</a>
    <a href="#">Essays</a>
    <a href="#">Archive</a>
    <a href="#">About</a>
  </nav>
</div>
</body></html>
