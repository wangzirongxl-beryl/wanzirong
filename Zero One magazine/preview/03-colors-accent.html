<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 20px; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { height: 90px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.04); padding: 8px 10px; display:flex; flex-direction:column; justify-content:space-between; }
.sw .name { font-family: Georgia, serif; font-style: italic; font-size: 14px; font-weight: 400; }
.sw .hex { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.8; }
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#B9A89A;color:#F1ECE4"><span class="name">Rose taupe</span><span class="hex">#B9A89A</span></div>
  <div class="sw" style="background:#C9A89E;color:#4E4A44"><span class="name">Dusty rose</span><span class="hex">#C9A89E</span></div>
  <div class="sw" style="background:#E3D6CB;color:#4E4A44"><span class="name">Rose 3</span><span class="hex">#E3D6CB</span></div>
  <div class="sw" style="background:#B48068;color:#F1ECE4"><span class="name">Terracotta</span><span class="hex">#B48068</span></div>
  <div class="sw" style="background:#A8B0A0;color:#F1ECE4"><span class="name">Sage</span><span class="hex">#A8B0A0</span></div>
  <div class="sw" style="background:#CED2C6;color:#4E4A44"><span class="name">Sage 2</span><span class="hex">#CED2C6</span></div>
  <div class="sw" style="background:#9AA6AC;color:#F1ECE4"><span class="name">Powder blue</span><span class="hex">#9AA6AC</span></div>
  <div class="sw" style="background:#F6F1E9;color:#4E4A44;display:flex;align-items:center;justify-content:center;text-align:center"><span style="font-family:Georgia,serif;font-style:italic;font-size:14px;color:#B48068">one accent per screen</span></div>
</div>
</body></html>
