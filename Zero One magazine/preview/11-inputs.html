<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;max-width:320px;margin-bottom:14px}
.label{font-family:Georgia,serif;font-style:italic;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--clay)}
.input{font-family:Georgia,serif;font-size:15px;padding:10px 12px;background:var(--cream-2);border:1px solid var(--sand);border-radius:2px;color:var(--ink);outline:none;transition:border var(--dur-base) var(--ease-out)}
.input:focus{border-color:var(--clay)}
.row{display:flex; gap:20px}
.toggle{display:inline-flex; align-items:center; gap:8px; font-family:Georgia,serif; font-size:14px; font-style: italic;}
.dot{width:14px; height:14px; border-radius:999px; border:1px solid var(--clay); background:var(--cream)}
.dot.on{background:var(--terracotta); border-color:var(--terracotta)}
</style></head>
<body>
<div class="row">
  <div>
    <div class="field"><span class="label">Your email</span><input class="input" value="annie@example.com"/></div>
    <div class="field"><span class="label">Name (optional)</span><input class="input" placeholder="…" /></div>
  </div>
  <div style="align-self:center">
    <div class="toggle"><span class="dot on"></span> Profiles</div>
    <div class="toggle" style="margin-top:8px"><span class="dot"></span> Essays only</div>
  </div>
</div>
</body></html>
