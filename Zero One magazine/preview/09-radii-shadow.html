<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:var(--cream); border:1px solid var(--sand); width:80px; height:60px;}
.box.soft-shadow{box-shadow: var(--shadow-soft)}
.box.clay{border-color: var(--clay)}
.lbl{font-family:ui-monospace,monospace; font-size:11px; color:var(--ink-2)}
</style></head>
<body>
<div class="eyebrow" style="margin-bottom:14px">Radii · Borders · Shadow</div>
<div class="row">
  <div class="chip"><div class="box" style="border-radius:2px"></div><span class="lbl">2px · inputs</span></div>
  <div class="chip"><div class="box" style="border-radius:4px"></div><span class="lbl">4px · cards</span></div>
  <div class="chip"><div class="box" style="border-radius:999px; width:100px; height:40px; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-style:italic; font-size:14px; background:var(--terracotta); color:var(--cream); border:none">Subscribe</div><span class="lbl">pill · 1 button only</span></div>
  <div class="chip"><div class="box clay"></div><span class="lbl">1px Clay · focused</span></div>
  <div class="chip"><div class="box soft-shadow"></div><span class="lbl">soft shadow · rare</span></div>
</div>
</body></html>
