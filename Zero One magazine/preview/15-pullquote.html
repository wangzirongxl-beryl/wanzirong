<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.pq {
  font-family: Georgia, serif; font-size: 26px; line-height: 1.35;
  color: var(--ink); font-style: italic; font-weight: 400;
  padding: 18px 0; border-top: 1px solid var(--sand); border-bottom: 1px solid var(--sand);
  text-align:center; margin:0;
}
.pq::before { content:"∵"; display:block; color: var(--terracotta); font-size:16px; margin-bottom:6px; letter-spacing: 4px; }
.byline { display:block; margin-top:12px; font-family:Georgia,serif; font-style:italic; font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--clay); }
</style></head>
<body>
<blockquote class="pq">
  "We keep asking what women want. The better question is what they've already decided."
  <span class="byline">— from <i>The New Quiet</i>, Zero One Magazine</span>
</blockquote>
</body></html>
