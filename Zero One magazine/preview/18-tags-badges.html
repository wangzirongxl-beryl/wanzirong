<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px}
.tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tag{font-family:Georgia,serif; font-style:italic; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; padding:5px 14px; border-radius:999px; border:1px solid var(--sand); color:var(--ink-2); background:transparent}
.tag.on{background:var(--rose-taupe); border-color:var(--rose-taupe); color:var(--cream)}
.tag.accent{background:var(--terracotta); border-color:var(--terracotta); color:var(--cream)}
.badges{display:flex; gap:14px; align-items:center}
.badge{font-family:Georgia,serif; font-style:italic; font-size:11px; letter-spacing:0.22em; text-transform:uppercase}
.badge.profile{color:var(--terracotta)}
.badge.essay{color:var(--rose-taupe)}
.badge.interview{color:var(--sage)}
</style></head>
<body>
<div class="tags">
  <span class="tag on">All</span>
  <span class="tag">Profiles</span>
  <span class="tag">Essays</span>
  <span class="tag">Interviews</span>
  <span class="tag">2026</span>
  <span class="tag accent">Latest →</span>
</div>
<div class="badges">
  <span class="badge profile">· Profile</span>
  <span class="badge essay">· Essay</span>
  <span class="badge interview">· Interview</span>
</div>
</body></html>
