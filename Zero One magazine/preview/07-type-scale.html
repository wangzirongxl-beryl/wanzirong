<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px; font-family: Georgia, serif;}
.row{display:flex;align-items:flex-end;gap:18px;border-bottom:1px dashed var(--sand);padding-bottom:6px;margin-bottom:6px}
.row:last-child{border-bottom:none}
.tok{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3);flex:0 0 80px}
.sample{color:var(--ink); font-style: italic}
.meta-s{font-family:Georgia, serif; font-style:italic; font-size:12px;color:var(--ink-2);margin-left:auto}
</style></head>
<body>
<div class="row"><span class="tok">5xl / 84</span><span class="sample" style="font-size:44px; line-height:1;">Aa</span><span class="meta-s">Cover</span></div>
<div class="row"><span class="tok">4xl / 64</span><span class="sample" style="font-size:36px; line-height:1;">H1 — Title</span><span class="meta-s">Page title</span></div>
<div class="row"><span class="tok">2xl / 36</span><span class="sample" style="font-size:26px; line-height:1;">H2 — Section</span><span class="meta-s">Section</span></div>
<div class="row"><span class="tok">lg / 22</span><span class="sample" style="font-size:19px; line-height:1;">Lede / dek</span><span class="meta-s">Subhead</span></div>
<div class="row"><span class="tok">base / 17</span><span class="sample" style="font-size:15px; line-height:1; font-style:normal">Body prose at reading measure.</span><span class="meta-s">Body</span></div>
<div class="row"><span class="tok">xs / 12</span><span class="sample eyebrow" style="font-style:italic">EYEBROW · META</span><span class="meta-s">Meta</span></div>
</body></html>
