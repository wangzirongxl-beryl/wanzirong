<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 20px; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { height: 90px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.04); padding: 8px 10px; display:flex; flex-direction:column; justify-content:space-between; }
.sw .name { font-family: Georgia, serif; font-style: italic; font-size: 14px; font-weight: 400; }
.sw .hex { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.75; letter-spacing: 0.05em; }
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#F1ECE4;color:#4E4A44"><span class="name">Paper</span><span class="hex">#F1ECE4</span></div>
  <div class="sw" style="background:#F6F1E9;color:#4E4A44"><span class="name">Cream</span><span class="hex">#F6F1E9</span></div>
  <div class="sw" style="background:#D9D1C3;color:#4E4A44"><span class="name">Sand 2</span><span class="hex">#D9D1C3</span></div>
  <div class="sw" style="background:#C8BFB2;color:#4E4A44"><span class="name">Sand</span><span class="hex">#C8BFB2</span></div>
  <div class="sw" style="background:#A89A8C;color:#F1ECE4"><span class="name">Clay</span><span class="hex">#A89A8C</span></div>
  <div class="sw" style="background:#8A8378;color:#F1ECE4"><span class="name">Ink 3</span><span class="hex">#8A8378</span></div>
  <div class="sw" style="background:#6E6A62;color:#F1ECE4"><span class="name">Ink 2</span><span class="hex">#6E6A62</span></div>
  <div class="sw" style="background:#4E4A44;color:#F1ECE4"><span class="name">Ink</span><span class="hex">#4E4A44</span></div>
</div>
</body></html>
